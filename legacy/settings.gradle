pluginManagement {
    repositories {
        maven { name = 'Fabric';       url = 'https://maven.fabricmc.net/' }
        maven { name = 'Stonecutter';  url = 'https://maven.kikugie.dev/releases' }
        maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.2'
}

stonecutter {
    create(rootProject) {
        versions '1.21.11', '1.21.10', '1.21.9', '1.21.8', '1.21.7', '1.21.6',
                 '1.21.5', '1.21.4', '1.21.3', '1.21.2', '1.21.1', '1.21',
                 '1.20.6', '1.20.5', '1.20.4', '1.20.3', '1.20.2', '1.20.1', '1.20'
        vcsVersion = '1.21.1'
    }
}

rootProject.name = 'spotconnect-legacy'
