# ---------------------------------------------------------------------------
# Build settings. Everything is pinned to known-good versions that were
# researched against the actual Rinku (Keksuccino's MCEF fork) 1.21.1 branch.
# Do not "upgrade" these blindly -- they are matched to each other.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 1.21.1 requires Java 21 to build. Your default "java" is 17, so we
# point Gradle explicitly at your Temurin 21 install. Use forward slashes.
# If you ever move/upgrade the JDK, update this path.

# Minecraft / Fabric (values taken from Rinku's own 1.21.1 gradle.properties)

# This mod's own identity
mod_version=0.9.1
maven_group=com.lucaz.spotconnect
archives_base_name=spotconnect
