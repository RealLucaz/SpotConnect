plugins {
    // fabric-loom is the Gradle plugin that knows how to build Fabric mods
    // (download Minecraft, remap mappings, run a dev client, etc.)
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    // The Minecraft version we build against.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"


    // Fabric loader + the Fabric API (gives us keybinding + client-tick helpers).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu, compile-only on purpose: it gives us the config-button entrypoint
    // without becoming a requirement. Without Mod Menu installed the entrypoint is
    // simply never invoked, and nothing here is loaded.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Dev client only, so the config button can be tested. Not shipped.
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // NOTE: deliberately NO embedded-browser library. Playback runs in a dedicated
    // real Chrome process launched by the mod (see browser/ChromeLauncher). Embedding
    // was ruled out: the CEF builds available to us lack AAC, and Widevine VMP signing
    // makes Spotify DRM unusable in an unsigned embedded browser.
}

processResources {
    inputs.property "version", project.version
    // Substitutes ${version} inside fabric.mod.json at build time.
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    // -processing: we use annotations (@NotNull) with no annotation processor, which
    // is expected and would otherwise emit a warning on every build.
    it.options.compilerArgs << '-Xlint:all,-processing'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
