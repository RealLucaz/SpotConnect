pluginManagement {
    repositories {
        maven { name = 'Fabric';        url = 'https://maven.fabricmc.net/' }
        maven { name = 'Stonecutter';   url = 'https://maven.kikugie.dev/releases' }
        maven { name = 'Terraformers';  url = 'https://maven.terraformersmc.com/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.2'
}

stonecutter {
    create(rootProject) {
        versions '26.2', '26.1.2', '26.1.1', '26.1'
        vcsVersion = '26.1.2'
    }
}

rootProject.name = 'spotconnect'
